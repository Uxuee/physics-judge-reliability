[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-judge-reliability"
version = "0.1.0"
description = "Prompt sensitivity and correctness of LLM judges evaluating physics reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
reproduction = ["numpy>=1.24"]
